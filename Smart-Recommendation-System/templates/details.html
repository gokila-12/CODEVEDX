<!DOCTYPE html>
<html>

<head>

<title>{{ movie.title }}</title>

<link rel="stylesheet"
href="{{ url_for('static',filename='style.css') }}">

</head>

<body>

<nav class="navbar">

<div class="logo">

🎬 AI Stream

</div>

</nav>

<section class="details-page">

<div class="poster">

<img src="{{ url_for('static',
filename='images/posters/' + movie.poster) }}">

</div>

<div class="details">

<h1>{{ movie.title }}</h1>

<h3>{{ movie.genre }}</h3>

<h4>{{ movie.year }}</h4>

<div class="rating">

⭐ {{ movie.rating }}/10

</div>

<p>

{{ movie.description }}

</p>

<a href="/watchlist/add/{{ movie.title }}">

<button class="watch-btn">

❤ Add to Watchlist

</button>

</a>

</div>

</section>

<section class="section">

<h2>Recommended Movies</h2>

<div class="movie-row">

{% for item in recommendations %}

<div class="movie-card">

<a href="/movie/{{ item.title }}">

<img src="{{ url_for('static',
filename='images/posters/' + item.poster) }}">

</a>

<div class="movie-info">

<h3>{{ item.title }}</h3>

<p>{{ item.genre }}</p>

</div>

</div>

{% endfor %}

</div>

</section>

</body>

</html>
