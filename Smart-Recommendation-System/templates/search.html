<!DOCTYPE html>
<html>

<head>

<title>{{ query }}</title>

<link rel="stylesheet"
href="{{ url_for('static',
filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>

{{ query }}

</h1>

<div class="movie-row">

{% for movie in movies %}

<div class="movie-card">

<a href="/movie/{{ movie.title }}">

<img src="{{ url_for('static',
filename='images/posters/' + movie.poster) }}">

</a>

<div class="movie-info">

<h3>

{{ movie.title }}

</h3>

<p>

{{ movie.genre }}

</p>

<p>

⭐ {{ movie.rating }}

</p>

<a href="/watchlist/add/{{ movie.title }}">

<button class="login-btn">

❤ Add

</button>

</a>

</div>

</div>

{% endfor %}

</div>

</div>

</body>

</html>
